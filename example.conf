# Copy this file to:
#   ~/.config/hashcat-local.conf          (local mode)
#   ~/.config/remote-hashcat.conf         (remote docker mode)

# ---------- LOCAL MODE ----------
HASHCAT_BIN="hashcat"
LOCAL_ROOT="$HOME/hashcat"

# ---------- REMOTE DOCKER MODE ----------
HOST="user@my-server.com"
CONTAINER="hashcat"
REMOTE_ROOT="/road/road"
REMOTE_OUTPUT="/road/road/output"
